<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部文章 · 青柠笔记</title>
<meta name="description" content="记录代码与生活的个人博客">
<meta name="theme-color" content="#2f6fed">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="posts">
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="返回首页">
      <span class="brand-mark" data-site="mark">柠</span>
      <span class="brand-name" data-site="name">青柠笔记</span>
    </a>
    <nav class="nav" id="siteNav" aria-label="主导航"></nav>
    <div class="header-tools">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="搜索" title="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切换深浅色" title="切换深浅色">
        <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
      <a class="icon-btn" href="admin.html" aria-label="后台管理" title="后台管理">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.2-3.7 4-5.6 7.5-5.6s6.3 1.9 7.5 5.6"/></svg>
      </a>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="菜单" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <nav class="nav-mobile" id="mobileNav" aria-label="移动端导航"></nav>
</header>


<header class="page-head"><div class="wrap"><h1>全部文章</h1><p>按时间倒序排列，可按分类筛选或直接搜索。</p></div></header>
<main class="page-main flat">
  <div class="wrap">
    <div class="layout">
      <div class="col-main">
        <div class="card pad">
          <div class="search-box" style="margin-bottom:12px">
            <label class="field">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
              <input type="search" id="searchInput" placeholder="搜索标题、摘要或正文…" aria-label="搜索文章">
            </label>
          </div>
          <div class="pill-cloud" id="catFilter"></div>
          <p style="margin:12px 0 0;font-size:12.5px;color:var(--ink-3)" id="resultTip"></p>
        </div>
        <div class="col-main" id="postList"><div class="card skeleton">正在加载文章…</div></div>
        <div id="postPager"></div>
      </div>
      <aside class="col-side" id="sideCol"></aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links" id="footerLinks"></div>
    <p>© <span id="year">2026</span> <span id="footerName">青柠笔记</span> · 用文字与照片记录生活</p>
    <p style="margin-top:6px;opacity:.8">纯静态站点 · GitHub Pages 托管</p>
  </div>
</footer>
<button class="to-top" id="toTop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>

<script src="js/app.js"></script>
</body>
</html>
